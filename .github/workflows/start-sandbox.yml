name: neue fische AWS Sandbox

# Capstone complete: start/stop the educational lab only on request.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose sandbox action"
        required: true
        type: choice
        default: Start
        options:
          - Start
          - Stop

      debug:
        description: "Upload screenshots (warning: these can show lab credentials)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neue-fische-sandbox-start
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  start-sandbox:
    name: ${{ inputs.action || 'Start' }} AWS Account Lab
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the required secrets exist
        shell: bash
        env:
          CLOUDLABS_LOGIN_ID: ${{ secrets.CLOUDLABS_LOGIN_ID }}
          CLOUDLABS_PASSWORD: ${{ secrets.CLOUDLABS_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDLABS_LOGIN_ID}" || -z "${CLOUDLABS_PASSWORD}" ]]; then
            echo "::error::Missing CLOUDLABS_LOGIN_ID and/or CLOUDLABS_PASSWORD."
            echo "Add them under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Restore cached Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          # Install at the repository root: ESM imports resolve by walking up from
          # the script, and unlike CommonJS they ignore NODE_PATH.
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: ${{ inputs.action || 'Start' }} the lab
        shell: bash
        env:
          CLOUDLABS_LOGIN_ID: ${{ secrets.CLOUDLABS_LOGIN_ID }}
          CLOUDLABS_PASSWORD: ${{ secrets.CLOUDLABS_PASSWORD }}
          CLOUDLABS_LAB_NAME: ${{ vars.CLOUDLABS_LAB_NAME || 'AWS Account Lab' }}
          CLOUDLABS_DEBUG: ${{ inputs.debug && '1' || '0' }}
          # Manual action defaults to Start if no explicit action is supplied.
          CLOUDLABS_ACTION: ${{ inputs.action || 'Start' }}
        run: node scripts/start-sandbox.mjs

      - name: Upload debug screenshots
        if: ${{ always() && inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudlabs-debug
          path: debug/
          retention-days: 1
          if-no-files-found: ignore
