name: Start neue fische AWS Sandbox

on:
  schedule:
    # Run every day at 06:00 Germany time, including daylight-saving changes.
    - cron: "0 6 * * *"
      timezone: "Europe/Berlin"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neue-fische-sandbox-start
  cancel-in-progress: false

jobs:
  start-sandbox:
    name: Sign in and start AWS Account Lab
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_DIR="${RUNNER_TEMP}/cloudlabs-playwright"
          npm install --prefix "${PLAYWRIGHT_DIR}" --no-save playwright
          "${PLAYWRIGHT_DIR}/node_modules/.bin/playwright" install --with-deps chromium

      - name: Sign in and start the lab if it is stopped
        shell: bash
        env:
          CLOUDLABS_LOGIN_ID: ${{ secrets.CLOUDLABS_LOGIN_ID }}
          CLOUDLABS_PASSWORD: ${{ secrets.CLOUDLABS_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDLABS_LOGIN_ID}" || -z "${CLOUDLABS_PASSWORD}" ]]; then
            echo "Required GitHub Actions secrets are missing."
            echo "Add CLOUDLABS_LOGIN_ID and CLOUDLABS_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          NODE_PATH="${RUNNER_TEMP}/cloudlabs-playwright/node_modules" node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            try {
              await page.goto(
                "https://cloudlabs.nuvepro.com/company/Neuefische/home",
                { waitUntil: "domcontentloaded", timeout: 90_000 },
              );

              // Log only safe page and field metadata if the expected form is
              // missing. Never log input values or the full URL query string.
              const loginInput = page.locator("#userName:visible");
              try {
                await loginInput.waitFor({ state: "visible", timeout: 10_000 });
              } catch {
                const safeUrl = (rawUrl) => {
                  try {
                    const url = new URL(rawUrl);
                    return `${url.origin}${url.pathname}`;
                  } catch {
                    return "unavailable";
                  }
                };
                const diagnostics = await Promise.all(
                  page.frames().map(async (frame) => ({
                    url: safeUrl(frame.url()),
                    fields: await frame.locator("input").evaluateAll((inputs) =>
                      inputs
                        .filter((input) => {
                          const style = getComputedStyle(input);
                          const rect = input.getBoundingClientRect();
                          return style.visibility !== "hidden" &&
                            style.display !== "none" &&
                            rect.width > 0 &&
                            rect.height > 0;
                        })
                        .map((input) => ({
                          id: input.id || "",
                          name: input.getAttribute("name") || "",
                          type: input.getAttribute("type") || "",
                          placeholder: input.getAttribute("placeholder") || "",
                          ariaLabel: input.getAttribute("aria-label") || "",
                        })),
                    ),
                  })),
                );
                console.error("Login form diagnostics (field values omitted):");
                console.error(JSON.stringify({
                  pageUrl: safeUrl(page.url()),
                  pageTitle: await page.title(),
                  frames: diagnostics,
                }));
                throw new Error("Visible #userName login field was not found.");
              }

              // The portal renders a second, duplicate Login ID input. Target
              // the visible primary field by its unique DOM id.
              await loginInput.fill(process.env.CLOUDLABS_LOGIN_ID);
              await page.locator('input[type="password"]:visible').first().fill(
                process.env.CLOUDLABS_PASSWORD,
              );
              await page.getByRole("button", { name: /^Sign in$/i }).first().click();

              await page.getByText("AWS Account Lab", { exact: true }).waitFor({
                state: "visible",
                timeout: 90_000,
              });
              await page.getByText("View Lab", { exact: true }).click();

              const stopButton = page.getByText(/^Stop$/i).first();
              const startButton = page.getByText(/^Start$/i).first();

              if (await stopButton.isVisible().catch(() => false)) {
                console.log("AWS Account Lab is already running; no click needed.");
                return;
              }

              if (!(await startButton.isVisible().catch(() => false))) {
                throw new Error("Neither Start nor Stop is visible on the lab page.");
              }

              await startButton.click();
              await stopButton.waitFor({ state: "visible", timeout: 240_000 });
              console.log("AWS Account Lab started successfully.");
            } finally {
              // Do not save screenshots, traces, or page contents: the lab page
              // can display temporary AWS credentials.
              await browser.close();
            }
          })().catch((error) => {
            console.error("CloudLabs start automation failed.");
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
