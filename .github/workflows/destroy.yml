name: Destroy Development Environment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY DEV to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: langnation-dev-infrastructure
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy Sandbox Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPECTED_ORGANIZATION: cloudforge-capstone
      EXPECTED_WORKSPACE: langnation-capstone-dev

    steps:
      - name: Validate confirmation and target
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "LANGNATION DESTRUCTIVE OPERATION"
          echo "Environment : dev"
          echo "Organization: ${TFC_ORGANIZATION}"
          echo "Workspace   : ${TFC_WORKSPACE}"
          echo "Action      : DESTROY"
          echo "========================================"

          if [ "${CONFIRMATION}" != "DESTROY DEV" ]; then
            echo "Confirmation text is incorrect."
            echo "Expected exactly: DESTROY DEV"
            exit 1
          fi

          if [ "${TFC_ORGANIZATION}" != "${EXPECTED_ORGANIZATION}" ]; then
            echo "Unexpected HCP Terraform organization."
            echo "Expected: ${EXPECTED_ORGANIZATION}"
            echo "Actual:   ${TFC_ORGANIZATION}"
            exit 1
          fi

          if [ "${TFC_WORKSPACE}" != "${EXPECTED_WORKSPACE}" ]; then
            echo "Unexpected HCP Terraform workspace."
            echo "Expected: ${EXPECTED_WORKSPACE}"
            echo "Actual:   ${TFC_WORKSPACE}"
            exit 1
          fi

          echo "Safety validation passed."

      - name: Find and validate HCP Terraform workspace
        id: workspace
        shell: bash
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}/workspaces/${TFC_WORKSPACE}")

          WORKSPACE_ID=$(echo "${RESPONSE}" | jq -r '.data.id')
          WORKSPACE_NAME=$(echo "${RESPONSE}" | jq -r '.data.attributes.name')
          ALLOW_DESTROY=$(echo "${RESPONSE}" | jq -r '.data.attributes["allow-destroy-plan"]')
          IS_DESTROYABLE=$(echo "${RESPONSE}" | jq -r '.data.attributes.actions["is-destroyable"] // false')
          LOCKED=$(echo "${RESPONSE}" | jq -r '.data.attributes.locked')

          if [ -z "${WORKSPACE_ID}" ] || [ "${WORKSPACE_ID}" = "null" ]; then
            echo "Could not determine HCP Terraform workspace ID."
            exit 1
          fi

          if [ "${WORKSPACE_NAME}" != "${EXPECTED_WORKSPACE}" ]; then
            echo "Workspace name returned by HCP Terraform does not match the expected workspace."
            echo "Expected: ${EXPECTED_WORKSPACE}"
            echo "Actual:   ${WORKSPACE_NAME}"
            exit 1
          fi

          if [ "${ALLOW_DESTROY}" != "true" ]; then
            echo "Destroy plans are not allowed for this HCP Terraform workspace."
            exit 1
          fi

          if [ "${IS_DESTROYABLE}" != "true" ]; then
            echo "HCP Terraform reports that this workspace is not currently destroyable."
            exit 1
          fi

          if [ "${LOCKED}" = "true" ]; then
            echo "The HCP Terraform workspace is currently locked."
            echo "Wait for the current operation to finish before destroying."
            exit 1
          fi

          echo "workspace_id=${WORKSPACE_ID}" >> "$GITHUB_OUTPUT"

          echo "Workspace validated:"
          echo "  Name: ${WORKSPACE_NAME}"
          echo "  ID: ${WORKSPACE_ID}"
          echo "  Destroy plans allowed: ${ALLOW_DESTROY}"
          echo "  Workspace destroyable: ${IS_DESTROYABLE}"
          echo "  Locked: ${LOCKED}"

      - name: Start HCP Terraform destroy run
        id: terraform-run
        shell: bash
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          WORKSPACE_ID: ${{ steps.workspace.outputs.workspace_id }}
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg workspace_id "${WORKSPACE_ID}" \
            '{
              data: {
                type: "runs",
                attributes: {
                  message: "Manual LangNation dev environment destroy",
                  "auto-apply": true,
                  "is-destroy": true
                },
                relationships: {
                  workspace: {
                    data: {
                      type: "workspaces",
                      id: $workspace_id
                    }
                  }
                }
              }
            }')

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            --data "${PAYLOAD}" \
            "https://app.terraform.io/api/v2/runs")

          RUN_ID=$(echo "${RESPONSE}" | jq -r '.data.id')

          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
            echo "HCP Terraform destroy run was not created."
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Destroy run created: ${RUN_ID}"

      - name: Wait for Terraform destroy
        shell: bash
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          RUN_ID: ${{ steps.terraform-run.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "Waiting for HCP Terraform destroy run ${RUN_ID}..."

          for attempt in {1..180}; do
            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail \
              --header "Authorization: Bearer ${TFC_TOKEN}" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/runs/${RUN_ID}")

            STATUS=$(echo "${RESPONSE}" | jq -r '.data.attributes.status')

            echo "Attempt ${attempt}: Terraform status = ${STATUS}"

            case "${STATUS}" in
              applied)
                echo "LangNation development infrastructure destroyed successfully."
                exit 0
                ;;

              planned_and_finished)
                echo "Terraform found no managed infrastructure to destroy."
                exit 0
                ;;

              errored|canceled|force_canceled|discarded)
                echo "Terraform destroy failed with status: ${STATUS}"
                exit 1
                ;;

              needs_confirmation)
                echo "Terraform is waiting for manual confirmation."
                echo "This destroy run was expected to auto-apply."
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "Timed out waiting for Terraform destroy."
          exit 1

      - name: Confirm destroy workflow scope
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "DESTROY WORKFLOW COMPLETED"
          echo "========================================"
          echo "Training sandbox infrastructure: destroyed"
          echo "HCP Terraform workspace: preserved"
          echo "HCP Terraform run history: preserved"
          echo "Personal AWS account: NOT modified"
          echo "Route 53: NOT modified"
          echo "langnation.com: NOT modified"
          echo "========================================"