name: Deploy LangNation to ECS

on:
  push:
    branches:
      - main
    paths:
      - "application/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

  ECR_REPOSITORY: langnation-cloud-platform-dev-app

  ECS_CLUSTER: langnation-cloud-platform-dev-cluster
  ECS_SERVICE: langnation-cloud-platform-dev-app-service
  ECS_TASK_DEFINITION: langnation-cloud-platform-dev-app

  CONTAINER_NAME: langnation-app

  ALB_NAME: langnation-cloud-platform-dev-lb

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: langnation-github-deploy

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Deploying image: ${IMAGE_URI}"

      - name: Build Docker image
        working-directory: application
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "${{ steps.image.outputs.image_uri }}" \
            .

      - name: Push Docker image to ECR
        shell: bash
        run: |
          set -euo pipefail

          docker push "${{ steps.image.outputs.image_uri }}"

      - name: Download current ECS task definition
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${ECS_TASK_DEFINITION}" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new image in ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image_uri }}

      - name: Deploy new ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Wait for ECS service stability
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for ECS service to reach steady state..."

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

          echo "ECS service reached steady state."

      - name: Verify deployed image
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="${{ steps.image.outputs.image_uri }}"

          echo "Expected image:"
          echo "${EXPECTED_IMAGE}"

          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].taskDefinition" \
            --output text)

          if [ -z "${TASK_DEFINITION_ARN}" ] || [ "${TASK_DEFINITION_ARN}" = "None" ]; then
            echo "Could not determine the active ECS task definition."
            exit 1
          fi

          echo "Active task definition:"
          echo "${TASK_DEFINITION_ARN}"

          DEPLOYED_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --query "taskDefinition.containerDefinitions[?name=='${CONTAINER_NAME}'].image | [0]" \
            --output text)

          echo "Deployed image:"
          echo "${DEPLOYED_IMAGE}"

          if [ "${DEPLOYED_IMAGE}" != "${EXPECTED_IMAGE}" ]; then
            echo "ERROR: ECS is not using the expected Git commit image."
            echo "Expected: ${EXPECTED_IMAGE}"
            echo "Actual:   ${DEPLOYED_IMAGE}"
            exit 1
          fi

          echo "Correct Git SHA image is deployed."

      - name: Verify ECS service counts
        shell: bash
        run: |
          set -euo pipefail

          DESIRED=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].desiredCount" \
            --output text)

          RUNNING=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].runningCount" \
            --output text)

          PENDING=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].pendingCount" \
            --output text)

          echo "Desired tasks: ${DESIRED}"
          echo "Running tasks: ${RUNNING}"
          echo "Pending tasks: ${PENDING}"

          if [ "${RUNNING}" -ne "${DESIRED}" ]; then
            echo "ERROR: Running task count does not match desired task count."
            exit 1
          fi

          if [ "${PENDING}" -ne 0 ]; then
            echo "ERROR: ECS still has pending tasks."
            exit 1
          fi

          echo "ECS task counts are healthy."

      - name: Verify application health through ALB
        shell: bash
        run: |
          set -euo pipefail

          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${ALB_NAME}" \
            --region "${AWS_REGION}" \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          if [ -z "${ALB_DNS}" ] || [ "${ALB_DNS}" = "None" ]; then
            echo "Could not determine the ALB DNS name."
            exit 1
          fi

          HEALTH_URL="http://${ALB_DNS}/health"

          echo "Checking application health:"
          echo "${HEALTH_URL}"

          for attempt in {1..30}; do
            echo "Health check attempt ${attempt}/30..."

            if RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 5 \
              --max-time 10 \
              "${HEALTH_URL}"); then

              echo "Response: ${RESPONSE}"

              if echo "${RESPONSE}" | jq -e '.status == "healthy"' > /dev/null; then
                echo "LangNation application is healthy and ready."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Application did not become healthy within the expected time."
          exit 1