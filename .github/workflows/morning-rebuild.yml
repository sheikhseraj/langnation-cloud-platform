name: Morning Sandbox Rebuild

on:
  # ============================================================
  # PRIMARY TRIGGER
  # ============================================================
  # Start recovery automatically after the neue fische sandbox
  # workflow completes successfully.
  workflow_run:
    workflows: ["neue fische AWS Sandbox"]
    types:
      - completed

  # ============================================================
  # FINAL MORNING FALLBACK
  # ============================================================
  # If the chained run failed or GitHub delayed/missed something,
  # check again at 08:17 Germany time.
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Berlin"

  # Manual recovery remains available.
  workflow_dispatch:


permissions:
  contents: read
  id-token: write


# Use the same concurrency group as infrastructure.yml.
# This prevents two infrastructure rebuilds from running together.
concurrency:
  group: langnation-dev-infrastructure
  cancel-in-progress: false


jobs:

  # ============================================================
  # 1. CHECK WHETHER RECOVERY IS REQUIRED
  # ============================================================
  should-run:
    name: Check Whether Recovery Is Needed
    runs-on: ubuntu-latest

    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:

      - name: Decide whether rebuild is required
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SANDBOX_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SANDBOX_EVENT: ${{ github.event.workflow_run.event }}

        run: |
          set -euo pipefail

          echo "========================================"
          echo "LANGNATION MORNING RECOVERY"
          echo "========================================"
          echo "Event: ${EVENT_NAME}"
          echo "========================================"

          # ----------------------------------------------------
          # Manual runs always perform a full rebuild.
          # ----------------------------------------------------
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual recovery requested."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi


          # ----------------------------------------------------
          # Triggered after neue fische sandbox workflow.
          # ----------------------------------------------------
          if [ "${EVENT_NAME}" = "workflow_run" ]; then

            echo "Sandbox workflow completed."
            echo "Sandbox event:      ${SANDBOX_EVENT}"
            echo "Sandbox conclusion: ${SANDBOX_CONCLUSION}"

            # The sandbox workflow can also be manually used to
            # Start or Stop the lab.
            #
            # A manual sandbox action must NOT automatically
            # trigger the complete infrastructure recovery.
            if [ "${SANDBOX_EVENT}" != "schedule" ]; then
              echo "Sandbox run was not a scheduled morning run."
              echo "Manual Start/Stop will not trigger infrastructure recovery."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi


            # Never start Terraform if the sandbox workflow failed.
            if [ "${SANDBOX_CONCLUSION}" != "success" ]; then
              echo "Sandbox workflow did not complete successfully."
              echo "Infrastructure recovery will not start."
              echo "The 08:17 fallback remains available."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Scheduled sandbox startup completed successfully."
          fi


          # ----------------------------------------------------
          # Health check
          #
          # Used by:
          # - 06:00 chained run
          # - 06:40 sandbox fallback chained run
          # - 08:17 final fallback
          #
          # This prevents unnecessary duplicate rebuilds.
          # ----------------------------------------------------
          echo "Checking existing LangNation endpoint..."

          if RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --connect-timeout 5 \
            --max-time 10 \
            "https://cloud.namienterprises.in/health"); then

            echo "Response: ${RESPONSE}"

            if echo "${RESPONSE}" \
              | jq -e '.status == "healthy"' > /dev/null; then

              echo "Application is already healthy."
              echo "No infrastructure recovery is required."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi


          echo "Application is not healthy."
          echo "Infrastructure recovery is required."
          echo "run=true" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. REBUILD AWS INFRASTRUCTURE
  # ============================================================
  terraform-rebuild:
    name: Rebuild AWS Infrastructure

    needs:
      - should-run

    if: needs.should-run.outputs.run == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      workspace_id: ${{ steps.workspace.outputs.workspace_id }}

    env:
      EXPECTED_ORGANIZATION: cloudforge-capstone
      EXPECTED_WORKSPACE: langnation-capstone-dev


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # Allow the training sandbox AWS APIs to become ready.
      #
      # CloudLabs may display "running" slightly before all AWS
      # services reliably accept requests.
      # --------------------------------------------------------
      - name: Let the sandbox settle
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash

        run: |
          set -euo pipefail

          echo "Waiting 3 minutes for the sandbox AWS account to settle..."
          sleep 180

          echo "Sandbox settle period completed."


      # --------------------------------------------------------
      # Find and validate HCP Terraform workspace
      # --------------------------------------------------------
      - name: Find HCP Terraform workspace
        id: workspace
        shell: bash

        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
          TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}

        run: |
          set -euo pipefail

          echo "Validating HCP Terraform configuration..."

          if [ "${TFC_ORGANIZATION}" != "${EXPECTED_ORGANIZATION}" ]; then
            echo "Unexpected HCP Terraform organization."
            echo "Expected: ${EXPECTED_ORGANIZATION}"
            echo "Actual:   ${TFC_ORGANIZATION}"
            exit 1
          fi

          if [ "${TFC_WORKSPACE}" != "${EXPECTED_WORKSPACE}" ]; then
            echo "Unexpected HCP Terraform workspace."
            echo "Expected: ${EXPECTED_WORKSPACE}"
            echo "Actual:   ${TFC_WORKSPACE}"
            exit 1
          fi


          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORGANIZATION}/workspaces/${TFC_WORKSPACE}")


          WORKSPACE_ID=$(echo "${RESPONSE}" | jq -r '.data.id')
          WORKSPACE_NAME=$(echo "${RESPONSE}" | jq -r '.data.attributes.name')
          LOCKED=$(echo "${RESPONSE}" | jq -r '.data.attributes.locked')


          if [ -z "${WORKSPACE_ID}" ] || \
             [ "${WORKSPACE_ID}" = "null" ]; then

            echo "Could not determine HCP Terraform workspace ID."
            exit 1
          fi


          if [ "${WORKSPACE_NAME}" != "${EXPECTED_WORKSPACE}" ]; then

            echo "Unexpected workspace returned by HCP Terraform."
            exit 1
          fi


          if [ "${LOCKED}" = "true" ]; then

            echo "HCP Terraform workspace is currently locked."
            exit 1
          fi


          echo "workspace_id=${WORKSPACE_ID}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "HCP TERRAFORM WORKSPACE"
          echo "========================================"
          echo "Organization: ${TFC_ORGANIZATION}"
          echo "Workspace:    ${WORKSPACE_NAME}"
          echo "Workspace ID: ${WORKSPACE_ID}"
          echo "========================================"


      # ========================================================
      # PRE-REBUILD DNS CLEANUP
      #
      # cloud.namienterprises.in lives permanently in the
      # PERSONAL AWS Route 53 account.
      #
      # The old CloudFront distribution is destroyed by the
      # sandbox cleanup, but its CNAME can remain in Route 53.
      #
      # That stale CNAME must be removed BEFORE Terraform creates
      # the new CloudFront distribution.
      # ========================================================

      # --------------------------------------------------------
      # Authenticate ONLY to personal AWS for Route 53.
      # --------------------------------------------------------
      - name: Configure Personal AWS credentials for DNS cleanup
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ vars.PERSONAL_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: langnation-route53-morning-pre-rebuild


      # --------------------------------------------------------
      # Safely remove stale CloudFront CNAME.
      #
      # SAFETY:
      # It will ONLY delete cloud.namienterprises.in and ONLY
      # when that CNAME currently points to *.cloudfront.net.
      # --------------------------------------------------------
      - name: Remove stale CloudFront DNS record
        shell: bash

        env:
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}

        run: |
          set -euo pipefail

          echo "========================================"
          echo "CHECKING PERSISTENT ROUTE 53 DNS"
          echo "========================================"


          RECORD=$(aws route53 list-resource-record-sets \
            --hosted-zone-id "${ROUTE53_ZONE_ID}" \
            --query "ResourceRecordSets[?Name == 'cloud.namienterprises.in.' && Type == 'CNAME'] | [0]" \
            --output json)


          if [ "${RECORD}" = "null" ] || \
             [ -z "${RECORD}" ]; then

            echo "No cloud.namienterprises.in CNAME exists."
            echo "No stale DNS cleanup required."
            exit 0
          fi


          CURRENT_TARGET=$(echo "${RECORD}" \
            | jq -r '.ResourceRecords[0].Value')


          echo "Current DNS:"
          echo "cloud.namienterprises.in -> ${CURRENT_TARGET}"


          # Critical safety protection:
          #
          # Never delete the record unless it is the expected
          # CloudFront CNAME.
          if [[ "${CURRENT_TARGET}" != *.cloudfront.net* ]]; then

            echo "========================================"
            echo "DNS SAFETY CHECK FAILED"
            echo "========================================"
            echo "The existing CNAME does not point to CloudFront."
            echo "The record will NOT be deleted."
            echo "========================================"

            exit 1
          fi


          jq -n \
            --argjson record "${RECORD}" \
            '{
              Comment:
                "Remove stale LangNation CloudFront CNAME before automated morning rebuild",
              Changes: [
                {
                  Action: "DELETE",
                  ResourceRecordSet: $record
                }
              ]
            }' > delete-dns.json


          CHANGE_ID=$(aws route53 change-resource-record-sets \
            --hosted-zone-id "${ROUTE53_ZONE_ID}" \
            --change-batch file://delete-dns.json \
            --query "ChangeInfo.Id" \
            --output text)


          if [ -z "${CHANGE_ID}" ] || \
             [ "${CHANGE_ID}" = "None" ]; then

            echo "Route 53 deletion request was not created."
            exit 1
          fi


          echo "Route 53 change ID: ${CHANGE_ID}"
          echo "Waiting for Route 53 deletion to become INSYNC..."


          aws route53 wait resource-record-sets-changed \
            --id "${CHANGE_ID}"


          echo "Route 53 reports INSYNC."
          echo "Stale cloud.namienterprises.in CNAME removed."


      # --------------------------------------------------------
      # Wait until public DNS resolvers no longer return the old
      # CloudFront CNAME.
      #
      # This protects Terraform from CloudFront:
      #
      # CNAMEAlreadyExists
      # --------------------------------------------------------
      - name: Wait for stale DNS cache to clear
        shell: bash

        run: |
          set -euo pipefail

          DOMAIN="cloud.namienterprises.in"


          if ! command -v dig >/dev/null 2>&1; then

            echo "dig is unavailable on this GitHub runner."
            echo "Waiting 330 seconds for previous DNS TTL to expire..."

            sleep 330
            exit 0
          fi


          echo "Waiting for stale public CNAME cache to disappear..."


          for attempt in {1..36}; do

            CLOUDFLARE_RESULT=$(dig \
              +short CNAME "${DOMAIN}" @1.1.1.1 \
              | tr -d '\r')

            GOOGLE_RESULT=$(dig \
              +short CNAME "${DOMAIN}" @8.8.8.8 \
              | tr -d '\r')


            echo "Attempt ${attempt}/36"
            echo "Cloudflare resolver: ${CLOUDFLARE_RESULT:-<empty>}"
            echo "Google resolver:     ${GOOGLE_RESULT:-<empty>}"


            if [ -z "${CLOUDFLARE_RESULT}" ] && \
               [ -z "${GOOGLE_RESULT}" ]; then

              echo "Old CloudFront CNAME is no longer visible."
              exit 0
            fi


            sleep 10

          done


          echo "Old DNS record is still cached after waiting."
          echo "Stopping rebuild to avoid CloudFront CNAMEAlreadyExists."

          exit 1


      # ========================================================
      # HCP TERRAFORM REBUILD
      # ========================================================

      # --------------------------------------------------------
      # Create HCP Terraform run
      # --------------------------------------------------------
      - name: Start HCP Terraform morning rebuild
        id: terraform-run
        shell: bash

        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          WORKSPACE_ID: ${{ steps.workspace.outputs.workspace_id }}

        run: |
          set -euo pipefail


          PAYLOAD=$(jq -n \
            --arg workspace_id "${WORKSPACE_ID}" \
            '{
              data: {
                type: "runs",
                attributes: {
                  message:
                    "Automated morning LangNation M1-M8 sandbox rebuild",
                  "auto-apply": true,
                  "is-destroy": false
                },
                relationships: {
                  workspace: {
                    data: {
                      type: "workspaces",
                      id: $workspace_id
                    }
                  }
                }
              }
            }')


          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail \
            --request POST \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            --data "${PAYLOAD}" \
            "https://app.terraform.io/api/v2/runs")


          RUN_ID=$(echo "${RESPONSE}" | jq -r '.data.id')


          if [ -z "${RUN_ID}" ] || \
             [ "${RUN_ID}" = "null" ]; then

            echo "HCP Terraform run was not created."
            exit 1
          fi


          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"


          echo "========================================"
          echo "HCP TERRAFORM MORNING REBUILD"
          echo "========================================"
          echo "Run ID: ${RUN_ID}"
          echo "Auto apply: enabled"
          echo "Environment: dev"
          echo "========================================"


      # --------------------------------------------------------
      # Wait for Terraform
      # --------------------------------------------------------
      - name: Wait for Terraform rebuild
        shell: bash

        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          RUN_ID: ${{ steps.terraform-run.outputs.run_id }}

        run: |
          set -euo pipefail

          echo "Waiting for HCP Terraform run ${RUN_ID}..."


          for attempt in {1..180}; do

            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail \
              --header "Authorization: Bearer ${TFC_TOKEN}" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/runs/${RUN_ID}")


            STATUS=$(echo "${RESPONSE}" \
              | jq -r '.data.attributes.status')


            echo "Attempt ${attempt}: Terraform status = ${STATUS}"


            case "${STATUS}" in

              applied)

                echo "Terraform rebuild completed successfully."
                exit 0
                ;;


              planned_and_finished)

                echo "Terraform found no infrastructure changes."
                exit 0
                ;;


              errored|canceled|force_canceled|discarded)

                echo "Terraform rebuild failed with status: ${STATUS}"
                exit 1
                ;;


              needs_confirmation)

                echo "Terraform unexpectedly requires manual confirmation."
                echo "Morning recovery expects auto-apply."
                exit 1
                ;;

            esac


            sleep 30

          done


          echo "Timed out waiting for HCP Terraform."
          exit 1


      # --------------------------------------------------------
      # Terraform result
      # --------------------------------------------------------
      - name: Terraform rebuild summary
        shell: bash

        run: |
          set -euo pipefail

          echo "========================================"
          echo "LANGNATION TERRAFORM RECOVERY"
          echo "========================================"
          echo "M1-M8 infrastructure: READY"
          echo "Environment:            dev"
          echo "Application deploy:     NEXT"
          echo "Route 53 sync:          AFTER DEPLOY"
          echo "========================================"


  # ============================================================
  # 3. RESTORE LANGNATION APPLICATION
  # ============================================================
  deploy-application:
    name: Restore LangNation Application

    needs:
      - terraform-rebuild

    if: needs.terraform-rebuild.result == 'success'

    uses: ./.github/workflows/deploy.yml

    secrets: inherit


  # ============================================================
  # 4. RESTORE PERSISTENT DNS + VERIFY PUBLIC APPLICATION
  # ============================================================
  sync-dns:
    name: Sync Persistent Route 53 DNS

    needs:
      - terraform-rebuild
      - deploy-application

    if: |
      needs.terraform-rebuild.result == 'success' &&
      needs.deploy-application.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15


    steps:

      # --------------------------------------------------------
      # Read the NEW CloudFront hostname from HCP Terraform.
      # --------------------------------------------------------
      - name: Read CloudFront domain from HCP Terraform
        id: cloudfront
        shell: bash

        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          WORKSPACE_ID: ${{ needs.terraform-rebuild.outputs.workspace_id }}

        run: |
          set -euo pipefail


          echo "Reading CloudFront domain from HCP Terraform..."


          for attempt in {1..30}; do

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output hcp-outputs.json \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${TFC_TOKEN}" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/current-state-version-outputs")


            if [ "${HTTP_CODE}" = "200" ]; then

              CLOUDFRONT_DOMAIN=$(jq -r '
                .data[]
                | select(.attributes.name == "cloudfront_domain_name")
                | .attributes.value
              ' hcp-outputs.json | head -n 1)


              if [ -n "${CLOUDFRONT_DOMAIN}" ] && \
                 [ "${CLOUDFRONT_DOMAIN}" != "null" ]; then

                echo "CloudFront domain: ${CLOUDFRONT_DOMAIN}"

                echo "cloudfront_domain=${CLOUDFRONT_DOMAIN}" \
                  >> "$GITHUB_OUTPUT"

                exit 0
              fi

            fi


            echo "CloudFront output not ready yet."
            echo "Attempt ${attempt}/30..."

            sleep 10

          done


          echo "Could not obtain cloudfront_domain_name from HCP Terraform."
          exit 1


      # --------------------------------------------------------
      # Authenticate to persistent PERSONAL Route 53.
      # --------------------------------------------------------
      - name: Configure Personal AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6

        with:
          role-to-assume: ${{ vars.PERSONAL_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: langnation-route53-morning-sync


      # --------------------------------------------------------
      # Restore:
      #
      # cloud.namienterprises.in
      #           ↓
      # new CloudFront distribution
      # --------------------------------------------------------
      - name: Update cloud.namienterprises.in
        id: route53
        shell: bash

        env:
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
          CLOUDFRONT_DOMAIN: ${{ steps.cloudfront.outputs.cloudfront_domain }}

        run: |
          set -euo pipefail


          echo "Updating persistent DNS..."
          echo "cloud.namienterprises.in -> ${CLOUDFRONT_DOMAIN}"


          cat > change-batch.json <<EOF
          {
            "Comment": "Automated LangNation morning CloudFront DNS synchronization",
            "Changes": [
              {
                "Action": "UPSERT",
                "ResourceRecordSet": {
                  "Name": "cloud.namienterprises.in.",
                  "Type": "CNAME",
                  "TTL": 300,
                  "ResourceRecords": [
                    {
                      "Value": "${CLOUDFRONT_DOMAIN}"
                    }
                  ]
                }
              }
            ]
          }
          EOF


          CHANGE_ID=$(aws route53 change-resource-record-sets \
            --hosted-zone-id "${ROUTE53_ZONE_ID}" \
            --change-batch file://change-batch.json \
            --query "ChangeInfo.Id" \
            --output text)


          if [ -z "${CHANGE_ID}" ] || \
             [ "${CHANGE_ID}" = "None" ]; then

            echo "Route 53 change was not created."
            exit 1
          fi


          echo "Route 53 change ID: ${CHANGE_ID}"
          echo "Waiting for DNS change to reach INSYNC..."


          aws route53 wait resource-record-sets-changed \
            --id "${CHANGE_ID}"


          echo "Route 53 DNS synchronization completed."


      # --------------------------------------------------------
      # Final end-to-end recovery check
      # --------------------------------------------------------
      - name: Verify public HTTPS health
        shell: bash

        run: |
          set -euo pipefail


          HEALTH_URL="https://cloud.namienterprises.in/health"


          echo "Waiting for public DNS and CloudFront..."
          echo "${HEALTH_URL}"


          for attempt in {1..36}; do

            echo "Health check attempt ${attempt}/36..."


            if RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 5 \
              --max-time 10 \
              "${HEALTH_URL}"); then


              echo "Response: ${RESPONSE}"


              if echo "${RESPONSE}" \
                | jq -e '.status == "healthy"' > /dev/null; then


                echo "========================================"
                echo "LANGNATION MORNING RECOVERY COMPLETE"
                echo "========================================"
                echo "Sandbox:                  READY"
                echo "Terraform M1-M8:          READY"
                echo "Application deployment:   READY"
                echo "Persistent Route 53 DNS:  READY"
                echo "Public HTTPS endpoint:    HEALTHY"
                echo "========================================"


                exit 0
              fi

            fi


            sleep 10

          done


          echo "Public HTTPS endpoint did not become healthy."
          exit 1